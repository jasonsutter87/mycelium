<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>launchkit auth UI</title>
<style>
  :root { --page: #f6f6f3; --ink: #1b1e27; --ink-2: #596072; --line: #d6d9e1; }
  @media (prefers-color-scheme: dark) { :root { --page: #12141b; --ink: #eceef4; --ink-2: #a4abbb; --line: #333847; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 44rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; display: grid; gap: 2rem; }
  nav { display: flex; justify-content: space-between; align-items: center; min-height: 3rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; } p { margin: 0; color: var(--ink-2); }
  .states button { font: inherit; min-height: 2.5rem; padding: .25rem .9rem; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .states button[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .box { padding: 1rem 1.25rem; border: 1px dashed var(--line); border-radius: 10px; }
  pre { margin: 0; padding: 1rem; border: 1px solid var(--line); border-radius: 10px; font: 13px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <nav><strong>My app</strong><span><lk-sign-in></lk-sign-in><lk-account></lk-account></span></nav>
  <header>
    <h1>Sign-in, drop-in</h1>
    <p>These components talk to a fake <code>/auth/me</code> in this page. The only thing the browser ever receives is profile JSON.</p>
    <div class="states" role="group" aria-label="Demo state" id="states" style="display:flex;gap:.5rem;margin-top:1rem"></div>
  </header>
  <section class="box"><lk-signed-in>Only people who are signed in see this.</lk-signed-in><lk-signed-out>Sign in to see the members-only part.</lk-signed-out></section>
  <section><pre id="log">Nothing yet.</pre></section>
</main>
<script type="module">
  import { LkAuth, storeFor } from './auth-ui.js';
  const users = { out: null, ada: { sub: 'u1', email: 'ada@example.com', name: 'Ada Lovelace', role: 'user' }, mail: { sub: 'u2', email: 'grace.hopper@example.com', name: 'grace.hopper', role: 'owner' } };
  let current = 'out';
  globalThis.fetch = async (url) => new Response(JSON.stringify({ user: users[current] }), { headers: { 'content-type': 'application/json' } });
  LkAuth.navigate = (url) => { log(`navigate -> ${url}`); current = 'ada'; storeFor().refresh(); setPressed('ada'); };
  const log = (m) => { document.getElementById('log').textContent = m; };
  for (const n of ['signin', 'signout', 'user', 'error']) document.addEventListener(`lk-auth:${n}`, (e) => log(`lk-auth:${n} ${JSON.stringify(e.detail)}`));
  const box = document.getElementById('states');
  const setPressed = (k) => box.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
  for (const [k, label] of [['out', 'Signed out'], ['ada', 'Signed in'], ['mail', 'Email-only name']]) {
    const b = document.createElement('button');
    b.textContent = label; b.dataset.k = k; b.setAttribute('aria-pressed', String(k === current));
    b.onclick = () => { current = k; setPressed(k); storeFor().refresh(); };
    box.append(b);
  }
  // the account menu posts a real form to /auth/logout; in this demo, intercept it
  document.addEventListener('submit', (e) => { e.preventDefault(); current = 'out'; setPressed('out'); storeFor().refresh(); log('POST /auth/logout (intercepted)'); }, true);
  storeFor().refresh();
</script>
</body>
</html>
